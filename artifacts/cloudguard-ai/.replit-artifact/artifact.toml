kind = "web"
previewPath = "/"
title = "CloudGuard AI"
description = "A hackathon demo dashboard for reviewing simulated GitHub pull requests, detecting Terraform security and cost issues, validating remediations, and requiring explicit human approval before applying a patch."
version = "1.0.0"
id = "artifacts/cloudguard-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23768

[services.development]
run = "pnpm --filter @workspace/cloudguard-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloudguard-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/cloudguard-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23768"
BASE_PATH = "/"
